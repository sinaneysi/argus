# Optional override for hosts where Docker's bridge network is unreachable (e.g. a VPN client that blocks local
# traffic): api and web share the host network; api on 127.0.0.1:${DEMO_PORT:-8080}, web on 127.0.0.1:${DEMO_WEB_PORT:-3000}.
#   docker compose -f demo/compose.yml -f demo/compose.host.yml up --build
# (web's proxy of the Go pages keeps the API address it was built with; open the API port for those pages.)
services:
  api:
    network_mode: host
    networks: !reset {}
    ports: !reset []
    environment:
      ARGUS_BIND: "127.0.0.1:${DEMO_PORT:-8080}"
    healthcheck:
      test: ["CMD", "/app/argus-api", "healthcheck", "http://127.0.0.1:${DEMO_PORT:-8080}/healthz"]
  web:
    network_mode: host
    networks: !reset {}
    ports: !reset []
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "${DEMO_WEB_PORT:-3000}"
      API_URL: "http://127.0.0.1:${DEMO_PORT:-8080}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${DEMO_WEB_PORT:-3000}/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
